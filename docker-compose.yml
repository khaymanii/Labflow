services:
  postgres:
    image: postgres:16-alpine
    container_name: labflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labflow
      POSTGRES_PASSWORD: labflow
      POSTGRES_DB: labflow
    ports:
      - "5432:5432"
    volumes:
      - labflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labflow -d labflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  labflow-postgres-data:
